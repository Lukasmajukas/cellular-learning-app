name: App build (Windows)
on:
  pull_request:
    paths: ['app/**', '.github/workflows/app-build.yml']
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app-build.yml']
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run e2e
      - run: npm run make
      # Keep only the one file you run (Setup.exe, not the zip and update files), only for main or a manual run, for 14 days.
      # Saving all four files from every pull request for 30 days filled the repository's storage (about 12.6 GB by Nov 3).
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with: { name: windows-installer, path: 'app/out/make/squirrel.windows/x64/*.exe', retention-days: 14, if-no-files-found: error }
      # Test pictures only when something failed (that's when they help).
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: screenshots, path: app/test-results, retention-days: 7 }
