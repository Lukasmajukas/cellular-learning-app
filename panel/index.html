<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cell Learning Progress</title>
<style>
/* Layout idea: one calm column, summary first (level bar), then now / waiting / done / next / diary. */
:root{--bg:#f3f6f9;--card:#ffffff;--ink:#14212e;--mute:#5d6f80;--line:#dde5ec;--accent:#0b7a75;--accent-soft:#d9f0ee;
--good:#1f8a4c;--warn:#b7791f;--bad:#c0392b;
--display:"Fraunces",Georgia,serif;--body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1720;--card:#16222d;--ink:#e8eff5;--mute:#93a5b5;--line:#25343f;--accent:#3cc3bb;--accent-soft:#12403e;--good:#4cc27f;--warn:#e0a63f;--bad:#ef6f61;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1720;--card:#16222d;--ink:#e8eff5;--mute:#93a5b5;--line:#25343f;--accent:#3cc3bb;--accent-soft:#12403e;--good:#4cc27f;--warn:#e0a63f;--bad:#ef6f61;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding:20px 16px 48px}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font:600 28px/1.2 var(--display);margin:0;text-wrap:balance}
h2{font:700 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 12px}
header{display:flex;flex-direction:column;gap:4px}
.fresh{color:var(--mute);font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;color:var(--accent);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.big{font:600 44px/1 var(--display);font-variant-numeric:tabular-nums}
.bar{height:16px;background:var(--line);border-radius:999px;overflow:hidden;margin:10px 0 16px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.levels{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.levels li{display:flex;gap:12px;align-items:center}
.dot{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:2px solid var(--line);color:var(--mute)}
.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.here .dot{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.here{font-weight:700}.locked{color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:14px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.kv{color:var(--mute);font-size:15px;margin:6px 0 0}
ul.plain{margin:0;padding:0;list-style:none;display:grid;gap:12px}
ul.plain li{padding-left:14px;border-left:3px solid var(--line)}
.waiting ul.plain li{border-left-color:var(--warn)}
.date{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
details{color:var(--mute);font-size:13px}
.lab{font-size:11px;color:var(--mute);opacity:.8;font-variant-numeric:tabular-nums}
.empty{color:var(--mute)}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const D = {"built": "2026-11-01 (robot run)", "levels": [{"n": 1, "name": "Research", "what": "Find out if the app is possible and how to build it", "state": "done"}, {"n": 2, "name": "The Plan", "what": "Write the PRD: the blueprint that says what's in the first version and what comes later", "state": "done"}, {"n": 3, "name": "Test build", "what": "One animated lesson screen, to prove the app runs smoothly on your PC", "state": "here"}, {"n": 4, "name": "First playable version", "what": "The real app: learning path, lessons, reviews, streaks. It's built one small piece per chat, band units first and tower-spotting units after.", "state": "locked"}, {"n": 5, "name": "Polish", "what": "Smoother animations, sounds, a mascot, more photos", "state": "locked"}, {"n": 6, "name": "Keep it fresh", "what": "Every 3 months, check the band and carrier facts (they change!) and update the lessons", "state": "locked"}], "done": 2, "pct": 39, "working": "Nothing in progress. Waiting for you: try the test build (T40).", "robot": {"on": true, "next": "right away (it starts its next job by itself), and every 2 hours", "last": "built the path map and lesson player (T29)"}, "light": "green", "limit": {"state": "fine (it reset after a pause)", "resets": "unknown"}, "waiting": [{"id": "T22", "text": "Open the progress panel (link in panel/README.md), pin it, and tell Claude in any chat if it looks right on your PC and phone.", "how": "Open: tell Claude in any chat"}, {"id": "T40", "text": "⭐ Try the test build: open the pull request/Actions page Claude links in chat (or ask Claude in any chat for the link), download the windows-installer file, run it (click More info, then Run anyway), and tell Claude in…", "how": "Open: tell Claude in any chat"}, {"id": "T02", "text": "Tell Claude: do you have an app name idea?", "how": "Open: tell Claude in any chat"}], "next": [{"id": "T39", "text": "Find a hands-free way for the robot to refresh your progress panel.", "who": "You + Claude", "star": false}], "upcoming": [], "recent": [{"id": "T29", "text": "Built the path map and the lesson player (app/src/PathMap.tsx, LessonPlayer.tsx, path.ts): lesson circles light up as you finish them and the next…", "date": "2026-11-01"}, {"id": "T28", "text": "Built the fact checker (content/tools/check_content.py, 11 tests): it refuses facts without status, date and source, photos without an allowed…", "date": "2026-11-01"}, {"id": "T27", "text": "Checked the carrier-code list against the official US registry (ATIS, via imsiadmin.com): 12 rows are now trusted, 312-530 is confirmed as T-Mobile…", "date": "2026-11-01"}, {"id": "T43", "text": "Fixed the bands file using the T42 review: the 4 carrier rows that weren't really proven are now UNVERIFIED, the two SpaceX rows moved to a new…", "date": "2026-11-01"}, {"id": "T42", "text": "Reviewed the bands file.", "date": "2026-10-31"}, {"id": "T06", "text": "Built the bands data file (content/bands.md and content/bands.json): 81 bands with frequencies copied from Wikipedia's band pages, plus 64 \"which…", "date": "2026-10-31"}], "diary": [{"date": "2026-11-01", "text": "The robot built the first half of the app skeleton (T29): a path map where lesson circles light up as you finish them (the next one unlocks), and a lesson player that plays any lesson and sends you back to the map with your stars. It uses sample questions only. It passed 8 unit tests and a real-app click test. Progress is not saved yet (that is T30)."}, {"date": "2026-11-01", "text": "The robot built the fact checker (T28): a small program that reads the bands file and refuses any fact missing a status, date or source, any photo without an allowed licence, any quiz answer that rests on an UNVERIFIED fact, and any quiz question whose ID changed. It passes on today's bands file. It has 11 tests."}, {"date": "2026-11-01", "text": "The robot checked the carrier-code list (T27) against the official American list. Most rows are now marked as trusted; 312-530 is confirmed as T-Mobile (not Charter). A few codes aren't on the official list, so they stay \"not checked\"."}, {"date": "2026-11-01", "text": "The robot fixed the bands file (T43): rows that weren't really proven are now marked UNVERIFIED, spectrum sales have their own list, grouped bands are split, and every band has plain number fields."}]};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const li = (t, sub, id) => `<li><div>${esc(t)}</div>${sub ? `<div class="date">${esc(sub)}</div>` : ''}${id ? ` <span class="lab">${esc(id)}</span>` : ''}</li>`;
const list = (a, f, none) => a.length ? `<ul class="plain">${a.map(f).join('')}</ul>` : `<div class="empty">${none}</div>`;
const light = {red:['bad','🔴 Busy: one chat is working, the others wait'], yellow:['warn','🟡 Unfinished work: the next run will pick it up'], green:['good','🟢 Free: the next run can start a job'], unknown:['','Light not known']}[D.light] || ['','Light not known'];
const lim = {fine:['good','Fine'], warning:['warn','Getting low'], used:['bad','Used up'], unknown:['','Not known']}[D.limit.state] || ['','Not known'];
const robot = D.robot.on === true ? ['good','Robot is on'] : D.robot.on === false ? ['warn','Robot is paused'] : ['','Robot status not known'];
const here = D.levels.find(l => l.state === 'here');
document.getElementById('app').innerHTML = `
<header>
  <h1>Cell Learning App</h1>
  <div class="fresh"><span>As of ${esc(D.built)}</span><button id="r" type="button">What does this mean?</button></div>
  <div id="why" class="kv" hidden>This page is a snapshot. Claude refreshes it at the end of each chat, so it can be a little out of date. It never talks to GitHub by itself and costs no Claude usage.</div>
</header>

<section class="card">
  <h2>Where we are</h2>
  <div class="big">${D.pct}%</div>
  <div class="bar" role="progressbar" aria-valuenow="${D.pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Overall progress"><i id="fill"></i></div>
  <ol class="levels">${D.levels.map(l => `<li class="${l.state}"><span class="dot">${l.state === 'done' ? '✓' : l.n}</span><span>${esc(l.name)}${l.state === 'here' ? ' · you are here' : ''}</span></li>`).join('')}</ol>
  ${here ? `<p class="kv">${esc(here.what)}</p>` : ''}
</section>

<section class="card">
  <h2>Right now</h2>
  <div>${D.working ? esc(D.working) : 'Nothing is being worked on.'}</div>
  <div class="row">
    <span class="pill ${robot[0]}">${robot[1]}</span>
    <span class="pill ${light[0]}">${light[1]}</span>
  </div>
  ${D.robot.next ? `<p class="kv">Next robot check: ${esc(D.robot.next)}</p>` : ''}
  <p class="kv">Your Claude usage: <span class="pill ${lim[0]}">${lim[1]}</span>${D.limit.resets ? ` resets ${esc(D.limit.resets)}` : ''}</p>
</section>

<section class="card waiting">
  <h2>Waiting for you</h2>
  ${list(D.waiting, w => li(w.text, w.how, w.id), 'Nothing. Claude has what it needs.')}
</section>

<section class="card">
  <h2>Done recently</h2>
  ${list(D.recent, r => li(r.text, r.date, r.id), 'Nothing yet.')}
</section>

<section class="card">
  <h2>Coming up</h2>
  ${list(D.next.concat(D.upcoming), n => li(n.text, n.who && n.who !== 'Claude' ? 'with ' + n.who : '', n.id), 'Nothing planned.')}
</section>

<section class="card">
  <h2>Diary</h2>
  ${list(D.diary, d => li(d.text, d.date), 'No entries.')}
</section>
<details><summary>About the small gray labels</summary>Labels like T18 are just names Claude uses to keep track of its own tasks. You can ignore them.</details>`;
requestAnimationFrame(() => requestAnimationFrame(() => { document.getElementById('fill').style.width = D.pct + '%'; }));
document.getElementById('r').onclick = () => { const w = document.getElementById('why'); w.hidden = !w.hidden; };
</script>
</body>
</html>
