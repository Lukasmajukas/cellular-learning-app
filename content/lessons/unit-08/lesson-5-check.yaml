unit: unit08
unit_title: Hardware
lesson: unit08-check
title: "Hardware certification"
questions:
  - id: u8-cp-draw-01
    kind: photo-choice
    facts: [hardware:form:radio-unit]
    photo: form-radio-unit-drawing-01
    alt: A drawing of a small finned box with short cables coming out
    prompt: Which box is in this drawing?
    choices: [Passive panel, Radio unit, Massive MIMO box]
    answer: 1
    why: A small box that makes the signal, with jumpers to a panel, is a radio unit.
  - id: u8-cp-draw-02
    kind: photo-choice
    facts: [hardware:form:massive-mimo]
    photo: form-massive-mimo-drawing-01
    alt: A drawing of one big box covered with a grid of small antenna squares
    prompt: Which box is in this drawing?
    choices: [Massive MIMO box, Radio unit, Passive panel]
    answer: 0
    why: Radio and many small antennas in one box is massive MIMO.
  - id: u8-cp-empty-01
    kind: choice
    facts: [hardware:form:passive-panel]
    prompt: Which box is only a cover and cables, with no electronics?
    choices: [Radio unit, Massive MIMO box, Passive panel]
    answer: 2
    why: Passive means nothing inside makes the signal.
  - id: u8-cp-mimo-01
    kind: choice
    facts: [hardware:form:massive-mimo, band:n41]
    prompt: n41 is fast mid-band TDD spectrum. Which box is often used for it?
    choices: [Massive MIMO box, Plain panel only]
    answer: 0
    why: Massive MIMO boxes serve fast mid-band (TDD) spectrum such as n41, n77 and CBRS.
  - id: u8-cp-port-01
    kind: photo-choice
    facts: [hardware:ports:nnhh]
    photo: ports-nnhh-drawing-01
    alt: A drawing of a flat panel with eight connectors in a row at the bottom
    prompt: How many connectors does this panel drawing show?
    choices: ["6", "8", "10"]
    answer: 1
    why: Eight connectors, like an NNHH panel.
  - id: u8-cp-port-02
    kind: choice
    facts: [hardware:ports:nnhh]
    prompt: An NNHH panel has 8 connectors. How many are for mid band?
    choices: ["2", "4", "8"]
    answer: 1
    why: 4 low band and 4 mid band.
  - id: u8-cp-port-03
    kind: choice
    facts: [hardware:ports:panel-length]
    prompt: A panel name ends in B. How long is it?
    choices: ['{hardware:ports:panel-length.len_a}', '{hardware:ports:panel-length.len_b}', '{hardware:ports:panel-length.len_c}']
    answer: 1
    why: A is {hardware:ports:panel-length.len_a}, B is {hardware:ports:panel-length.len_b} and C is {hardware:ports:panel-length.len_c}.
  - id: u8-cp-model-01
    kind: choice
    facts: [hardware:model:air-suffix]
    prompt: Which spectrum does the ending B48 mean?
    choices: [CBRS, C-band, 2.5 GHz]
    answer: 0
    why: B48 is CBRS.
  - id: u8-cp-model-02
    kind: choice
    facts: [hardware:model:air-64xx]
    prompt: AIR 6449 usually means how many radio paths?
    choices: ["32", "64", "192"]
    answer: 1
    why: The first two digits usually match the paths. That is a pattern, not a law.
  - id: u8-cp-model-03
    kind: choice
    facts: [hardware:model:radio-dual]
    prompt: Radio 4449 B5/B13 lists how many bands?
    choices: [One, Two]
    answer: 1
    why: B5 and B13 are two bands in one name.
  - id: u8-cp-use-01
    kind: choice
    facts: [hardware:use:air6449-b41-tmobile]
    prompt: T-Mobile's filings list the AIR 6449 B41. Which band is that?
    choices: [n41, n71]
    answer: 0
    why: It is a T-Mobile n41 radio.
  - id: u8-cp-use-02
    kind: choice
    facts: [hardware:evidence:brand-weakest]
    prompt: Which clue counts most?
    choices: [The carrier's sticker, The equipment brand, The panel length]
    answer: 0
    why: The sticker counts most and the brand counts least.
  - id: u8-cp-mix-01
    kind: choice
    facts: [band:n71, band:n41]
    prompt: n71 or n41, which one reaches farther from the tower?
    choices: [n71, n41]
    answer: 0
    why: n71 starts at {band:n71.dl_low_mhz} MHz and n41 at {band:n41.dl_low_mhz} MHz. Lower travels farther.
  - id: u8-cp-mix-02
    kind: choice
    facts: [site:type:monopole]
    prompt: Which tower is one tapered steel column?
    choices: [Guyed mast, Lattice tower, Monopole]
    answer: 2
    why: "{site:type:monopole.text}"
  - id: u8-cp-mix-03
    kind: choice
    facts: [band:n41, band:n71]
    prompt: Which of these is TDD, with uplink and downlink sharing one lane?
    choices: [n41, n71]
    answer: 0
    why: n41 is {band:n41.duplex}. n71 is {band:n71.duplex}.
