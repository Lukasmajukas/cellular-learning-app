unit: unit05
unit_title: Who uses what
lesson: unit05-l3
title: The 2025–26 changes
questions:
  - id: u5-sale-learn-01
    kind: learn
    title: Spectrum changes hands
    facts: [change:uscellular-tmobile, change:array-att-700-n77, change:array-tmobile-700, change:array-tmobile-600, change:array-verizon, change:echostar-att, change:tmobile-grain]
    text: >
      Carriers sell spectrum to each other. Closed deals so far: UScellular to T-Mobile ({change:uscellular-tmobile.date}),
      Array to AT&T ({change:array-att-700-n77.date}), Array to T-Mobile ({change:array-tmobile-700.date} and {change:array-tmobile-600.date}),
      Array to Verizon ({change:array-verizon.date}), EchoStar to AT&T ({change:echostar-att.date}) and T-Mobile to Grain Management ({change:tmobile-grain.date}).
      Array is what UScellular's spectrum company is called now.
  - id: u5-sale-learn-02
    kind: learn
    title: A deal that is still coming
    facts: [change:echostar-spacex-final]
    label: coming
    text: >
      EchoStar's trust is expected to hand spectrum to {change:echostar-spacex-final.to}. The last transfer is expected on or about {change:echostar-spacex-final.date}.
      It has not happened yet, so it stays marked "coming".
  - id: u5-sale-us-01
    kind: choice
    facts: [change:uscellular-tmobile]
    prompt: In {change:uscellular-tmobile.date}, who took over most of UScellular's network?
    choices: [T-Mobile, AT&T, Verizon]
    answer: 0
    why: The deal with {change:uscellular-tmobile.to} closed {change:uscellular-tmobile.date}.
  - id: u5-sale-att-01
    kind: choice
    facts: [change:array-att-700-n77]
    prompt: On {change:array-att-700-n77.date}, who bought n77 and 700 MHz spectrum from Array?
    choices: [Verizon, AT&T, T-Mobile]
    answer: 1
    why: The buyer was {change:array-att-700-n77.to}.
  - id: u5-sale-700-01
    kind: choice
    facts: [change:array-tmobile-700]
    prompt: On {change:array-tmobile-700.date}, Array sold 700 MHz (B12) to which carrier?
    choices: [AT&T, Verizon, T-Mobile]
    answer: 2
    why: The buyer was {change:array-tmobile-700.to}.
  - id: u5-sale-600-01
    kind: choice
    facts: [change:array-tmobile-600]
    prompt: On {change:array-tmobile-600.date}, T-Mobile bought which band from Array?
    choices: [B66 (AWS), "{change:array-tmobile-600.bands}", B2 (PCS)]
    answer: 1
    why: The deal of {change:array-tmobile-600.date} was for {change:array-tmobile-600.bands}.
  - id: u5-sale-vz-01
    kind: choice
    facts: [change:array-verizon]
    prompt: Who bought spectrum from Array on {change:array-verizon.date}?
    choices: [Verizon, AT&T, T-Mobile]
    answer: 0
    why: The buyer was {change:array-verizon.to}. Sources disagree on exactly which bands, so the app does not quiz you on that.
  - id: u5-sale-echo-01
    kind: choice
    facts: [change:echostar-att]
    prompt: On {change:echostar-att.date}, AT&T bought n77 and 600 MHz spectrum. From whom?
    choices: [Array, T-Mobile, EchoStar]
    answer: 2
    why: The seller was {change:echostar-att.from}.
  - id: u5-sale-grain-01
    kind: choice
    facts: [change:tmobile-grain]
    prompt: Who sold 800 MHz spectrum to Grain Management on {change:tmobile-grain.date}?
    choices: [AT&T, T-Mobile, EchoStar]
    answer: 1
    why: The seller was {change:tmobile-grain.from}.
  - id: u5-sale-first-01
    kind: choice
    facts: [change:uscellular-tmobile, change:echostar-att]
    prompt: Which came first?
    choices: ["UScellular to T-Mobile", "EchoStar to AT&T"]
    answer: 0
    why: UScellular to T-Mobile closed {change:uscellular-tmobile.date}. EchoStar to AT&T closed {change:echostar-att.date}.
  - id: u5-sale-array-01
    kind: choice
    facts: [change:array-att-700-n77, change:array-tmobile-700, change:array-verizon]
    prompt: Array made deals with three carriers. Which closed first?
    choices: [Verizon, T-Mobile, AT&T]
    answer: 2
    why: AT&T closed {change:array-att-700-n77.date}, T-Mobile {change:array-tmobile-700.date}, Verizon {change:array-verizon.date}.
  - id: u5-sale-twice-01
    kind: choice
    facts: [change:array-tmobile-700, change:array-tmobile-600]
    prompt: Which carrier bought from Array twice in May 2026?
    choices: [AT&T, T-Mobile, Verizon]
    answer: 1
    why: T-Mobile closed one deal on {change:array-tmobile-700.date} and another on {change:array-tmobile-600.date}.
  - id: u5-sale-coming-01
    kind: choice
    facts: [change:echostar-spacex-final]
    label: coming
    prompt: Is the EchoStar trust's last transfer to {change:echostar-spacex-final.to} finished?
    choices: ["Not yet, it is expected later", "Yes, it is finished"]
    answer: 0
    why: It is expected on or about {change:echostar-spacex-final.date}.
